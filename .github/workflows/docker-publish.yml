name: Docker Hub Publish

# Builds the repo Dockerfile and pushes a multi-arch image to Docker Hub.
# Requires repo secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.

on:
  push:
    branches: [master, feature/mobile-web]
  workflow_dispatch:

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        run: |
          sha_short="${GITHUB_SHA::7}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "totootao/watchlite:latest" >> "$GITHUB_OUTPUT"
          echo "totootao/watchlite:mobile" >> "$GITHUB_OUTPUT"
          echo "totootao/watchlite:sha-${sha_short}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/totootao/watchlite
            org.opencontainers.image.description=Ultra-lightweight single-binary server monitor with mobile web UI
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
